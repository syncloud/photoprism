apps:
  web:
    user: photoprism
    command: bin/service.web.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  mariadb:
    user: photoprism
    command: bin/service.mariadb.sh
    daemon: simple
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  cli:
    command: bin/cli.sh

  sql:
    command: bin/sql.sh

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

description: AI-Powered Photos App for the Decentralized Web. We are on a mission to protect your freedom and privacy
grade: stable
name: photoprism
summary: PhotoPrism AI-Powered Photos
